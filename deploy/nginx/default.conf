# Fast Pay 前端 + 反代后端（host 网络 / 同机后端版）
# 容器内 listen 4000；后端以 127.0.0.1:9200 监听。
server {
    listen       4000;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip 静态资源
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- 后端反代 ----
    # fun RPC：前端 api.create('/api') 请求 /api/cell，后端实际入口 /cell，
    # 去掉 /api 前缀后转发。
    location /api/ {
        proxy_pass http://127.0.0.1:9200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 16m;
    }

    # 易支付公开端点：下单 / 查单 / 收银台跳转
    location ~ ^/(submit|mapi|api)\.php$ {
        proxy_pass http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location = /health { proxy_pass http://127.0.0.1:9200; }

    # ---- SPA 静态 ----
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML 永远回源校验：部署换 hash 资源后，缓存的旧 index.html 会引用
    # 已删除的旧资源导致整页裸奔。资源本身带内容 hash 可永久缓存，
    # 只有入口 HTML 必须每次 revalidate。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
